<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dyēus Games</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="global-loading-state" class="global-loader hidden">
  <div class="loader-ornament"></div>
</div>

<div class="ornament-border top-border"></div>

<header class="site-header">
  <div class="header-container">
    <a href="/" class="logo">
      <span class="logo-text">DYĒUS GAMES</span>
    </a>

    <div class="search-bar">
      <input type="search" id="search-input" placeholder="Search store">
    </div>

    <nav class="main-nav">
      <ul>
        <li><a href="#" class="nav-link">Discover</a></li>
        <li><a href="#" class="nav-link active">Browse</a></li>
        <li><a href="#" class="nav-link">News</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="main-content">
  <section class="catalog-section">
    <div id="error-state" class="error-container hidden">
      <p class="error-message">Failed to load data.</p>
    </div>

    <div id="games-grid" class="games-grid"></div>

    <div id="scroll-trigger" class="scroll-trigger">
      <div id="more-loader" class="loader-ornament hidden" style="width: 40px; height: 40px;"></div>
    </div>
  </section>

  <aside class="sidebar hidden" id="sidebar">
    <div class="filters-header">
      <h2>Filters</h2>
      <button id="reset-filters">Reset</button>
    </div>

    <div class="filter-group">
      <label for="sort-select">Sort</label>
      <select id="sort-select">
        <option value="-added">Popularity</option>
        <option value="-rating">Rating</option>
        <option value="-released">Release Date</option>
        <option value="name">Name (A-Z)</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="genre-select">Genre</label>
      <select id="genre-select">
        <option value="">All Genres</option>
        <option value="action">Action</option>
        <option value="indie">Indie</option>
        <option value="adventure">Adventure</option>
        <option value="role-playing-games-rpg">RPG</option>
        <option value="shooter">Shooter</option>
      </select>
    </div>
  </aside>
</main>

<div class="ornament-border bottom-border"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
